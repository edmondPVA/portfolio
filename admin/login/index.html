<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://trhinuauacwgjkpoigdm.supabase.co; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Admin sign in | Edmond Polinar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../admin.css">
<script src="../theme.js"></script>
<script src="../session-hint.js"></script>
</head>
<body>
<div class="gate gate-login" id="sessionGate" role="status"><span class="spinner" aria-hidden="true"></span><span>Loading&hellip;</span></div>
<main class="auth-wrap">
  <section class="t auth-card" aria-labelledby="title">
    <div class="auth-top">
      <b>Edmond Polinar</b>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle dark mode"><span class="dot"></span><span id="themeLabel">Dark</span></button>
    </div>
    <p class="eyebrow">Admin</p>
    <h1 id="title">Sign in</h1>
    <p class="sub">Manage your portfolio content and read your messages.</p>

    <p class="form-msg" id="msg" role="alert" hidden></p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="pill full" id="loginBtn" type="submit">Sign in</button>
    </form>

    <a class="back" href="../../">&larr; Back to portfolio</a>
    <noscript><p class="form-msg">JavaScript is required to sign in.</p></noscript>
  </section>
</main>
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="../login.js"></script>
</body>
</html>
